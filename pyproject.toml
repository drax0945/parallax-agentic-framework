[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "parallax"
version = "0.1.0"
description = "Agentic cheminformatics framework: skills, continual memory, cited predictions and synthesis reasoning"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "rdkit>=2024.3",
    "httpx>=0.27",
    "scikit-learn>=1.4",
    "pandas>=2.2",
    "numpy>=1.26",
    "pydantic>=2.6",
    "typer>=0.12",
    "jinja2>=3.1",
    "tenacity>=8.2",
    "mcp>=1.2",
    "claude-agent-sdk>=0.2",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
parallax = "parallax.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/parallax"]

[tool.hatch.build.targets.wheel.force-include]
"src/parallax/ui/index.html" = "parallax/ui/index.html"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["network: test requires live network access", "slow: slow test (trains a model)"]
